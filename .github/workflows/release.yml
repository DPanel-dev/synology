name: Build Synology SPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'DPanel release tag (e.g. v1.11.3); build artifacts only'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: spk-${{ github.event_name }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DPANEL_REPO: donknap/dpanel
  DPANEL_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    permissions:
      contents: write # Reserve a number on the spk-build-number branch.
    outputs:
      artifact: ${{ steps.number.outputs.artifact }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reserve SPK build number
        id: number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! $DPANEL_TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+)([.-]([0-9]+))?$ ]]; then
            echo 'Expected vX.Y.Z, vX.Y.Z.N or vX.Y.Z-N' >&2
            exit 1
          fi
          base=${BASH_REMATCH[1]}
          # A workflow rerun also builds a new package. Only this counter branch is updated.
          ref=refs/heads/spk-build-number
          git init --bare -q "$RUNNER_TEMP/spk-counter.git"
          cd "$RUNNER_TEMP/spk-counter.git"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config credential.helper '!gh auth git-credential'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git mktree </dev/null)
          for attempt in {1..5}; do
            number=49
            parent=()
            head=$(git ls-remote --refs origin "$ref")
            if [[ -n $head ]]; then
              git fetch --quiet --depth=1 origin "$ref"
              parent=(-p FETCH_HEAD)
              previous=$(git log -1 --format=%s FETCH_HEAD)
              [[ $previous =~ ^SPK\ build\ ([1-9][0-9]*)$ ]] || { echo 'Invalid SPK counter' >&2; exit 1; }
              number=$((BASH_REMATCH[1] + 1))
            fi
            commit=$(git commit-tree "$tree" "${parent[@]}" -m "SPK build $number" -m "Run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT")
            if git push origin "$commit:$ref"; then
              echo "version=$base-$number" >> "$GITHUB_OUTPUT"
              echo "artifact=dpanel-synology-$base-$number" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Retry only if another build advanced the counter.
            next=$(git ls-remote --refs origin "$ref")
            [[ $next != "$head" ]] || exit 1
          done
          echo 'Could not reserve an SPK build number' >&2; exit 1

      - name: Build and verify SPKs
        env:
          GH_TOKEN: ${{ github.token }}
          version: ${{ steps.number.outputs.version }}
        run: |
          asset_name_list=$(gh release view --repo "$DPANEL_REPO" --json assets --jq '.assets[].name' -- "$DPANEL_TAG")
          mkdir -p dist
          for cpu in amd64 arm64; do
            case "$cpu" in
              amd64) arch=x86_64; machine='Advanced Micro Devices X86-64' ;;
              arm64) arch=armv8; machine=AArch64 ;;
            esac
            binary=package/app/server/dpanel
            asset_name=dpanel-ce-synology-$cpu
            if ! grep -Fxq -- "$asset_name" <<< "$asset_name_list"; then
              asset_name=dpanel-synology-$cpu
            fi
            gh release download --repo "$DPANEL_REPO" --pattern "$asset_name" \
              --output "$binary" --clobber -- "$DPANEL_TAG"
            header=$(LC_ALL=C readelf -h "$binary")
            grep -Eq 'Class: +ELF64$' <<< "$header"
            grep -Eq 'Data: +.*little endian$' <<< "$header"
            grep -Eq 'Type: +(EXEC|DYN) ' <<< "$header"
            grep -Eq "Machine: +$machine$" <<< "$header"
            chmod +x "$binary"
            sed -i -e "s/^version=.*/version=\"$version\"/" -e "s/^arch=.*/arch=\"$arch\"/" package/INFO
            ./sypack build ./package

            spk=dist/dpanel-$cpu.spk
            mv dpanel.spk "$spk"
            info=$(tar -xOf "$spk" INFO)
            grep -Fxq "version=\"$version\"" <<< "$info"
            grep -Fxq "arch=\"$arch\"" <<< "$info"
            checksum=$(tar -xOf "$spk" package.tgz | md5sum | cut -d ' ' -f 1)
            grep -Fxq "checksum=\"$checksum\"" <<< "$info"
            tar -tf "$spk" scripts/{preinst,postinst,preupgrade,postupgrade,postuninst,start-stop-status} \
              conf/{privilege,resource} WIZARD_UIFILES/{install,uninstall}_uifile.sh \
              scripts/locales/{en-US,zh-CN}.sh >/dev/null
            tar -xOf "$spk" package.tgz | tar -tzf - ./server/{dpanel,service.sh} ./ui/{config,config.js,index.html,locales/en-US.json,locales/zh-CN.json} >/dev/null
            entry=$(tar -xOf "$spk" package.tgz | tar -xzOf - ./ui/index.html)
            grep -Fq 'function getPanelEntry(' <<< "$entry"
            grep -Fq "url.searchParams.set('k'," <<< "$entry"
            grep -Fq 'location.assign(url);' <<< "$entry"
            if grep -Eq '#debug-|createElement\(.button.|report\(' <<< "$entry"; then
              echo 'Debug UI found in release entry' >&2; exit 1
            fi
          done
          (cd dist && sha256sum dpanel-amd64.spk dpanel-arm64.spk > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.number.outputs.artifact }}
          path: |
            dist/*.spk
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          packages=(dist/dpanel-amd64.spk dist/dpanel-arm64.spk dist/SHA256SUMS)
          if gh release view "$DPANEL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$DPANEL_TAG" "${packages[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release view "$DPANEL_TAG" --repo "$DPANEL_REPO" --json body --jq .body > release-notes.md
            gh release create "$DPANEL_TAG" "${packages[@]}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "DPanel $DPANEL_TAG for Synology DSM" --notes-file release-notes.md
          fi
