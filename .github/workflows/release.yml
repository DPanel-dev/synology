name: Build Synology SPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'DPanel release tag (e.g. v1.11.3); build artifacts only'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: spk-${{ github.event_name }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DPANEL_REPO: donknap/dpanel
  DPANEL_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and verify SPKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! $DPANEL_TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+)([.-]([0-9]+))?$ ]]; then
            echo 'Expected vX.Y.Z, vX.Y.Z.N or vX.Y.Z-N' >&2
            exit 1
          fi
          version=${BASH_REMATCH[1]}-${BASH_REMATCH[3]:-0}
          mkdir -p dist
          for cpu in amd64 arm64; do
            case "$cpu" in
              amd64) arch=x86_64; machine='Advanced Micro Devices X86-64' ;;
              arm64) arch=armv8; machine=AArch64 ;;
            esac
            binary=package/app/server/dpanel
            gh release download --repo "$DPANEL_REPO" --pattern "dpanel-synology-$cpu" \
              --output "$binary" --clobber -- "$DPANEL_TAG"
            header=$(LC_ALL=C readelf -h "$binary")
            grep -Eq 'Class: +ELF64$' <<< "$header"
            grep -Eq 'Data: +.*little endian$' <<< "$header"
            grep -Eq 'Type: +(EXEC|DYN) ' <<< "$header"
            grep -Eq "Machine: +$machine$" <<< "$header"
            chmod +x "$binary"
            sed -i -e "s/^version=.*/version=\"$version\"/" -e "s/^arch=.*/arch=\"$arch\"/" package/INFO
            ./sypack build ./package

            spk=dist/dpanel-$cpu.spk
            mv package/dpanel.spk "$spk"
            info=$(tar -xOf "$spk" INFO)
            grep -Fxq "version=\"$version\"" <<< "$info"
            grep -Fxq "arch=\"$arch\"" <<< "$info"
            checksum=$(tar -xOf "$spk" package.tgz | md5sum | cut -d ' ' -f 1)
            grep -Fxq "checksum=\"$checksum\"" <<< "$info"
            tar -tf "$spk" scripts/{preinst,postinst,preupgrade,postupgrade,postuninst,start-stop-status} \
              conf/{privilege,resource} WIZARD_UIFILES/install_uifile >/dev/null
            tar -xOf "$spk" package.tgz | tar -tzf - ./server/{dpanel,service.sh} ./ui/config >/dev/null
          done
          (cd dist && sha256sum dpanel-amd64.spk dpanel-arm64.spk > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: dpanel-synology-${{ env.DPANEL_TAG }}
          path: |
            dist/*.spk
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dpanel-synology-${{ env.DPANEL_TAG }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          packages=(dist/dpanel-amd64.spk dist/dpanel-arm64.spk dist/SHA256SUMS)
          if gh release view "$DPANEL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$DPANEL_TAG" "${packages[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release view "$DPANEL_TAG" --repo "$DPANEL_REPO" --json body --jq .body > release-notes.md
            gh release create "$DPANEL_TAG" "${packages[@]}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "DPanel $DPANEL_TAG for Synology DSM" --notes-file release-notes.md
          fi
