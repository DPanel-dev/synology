<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DPanel</title>
  <script src="connection.js" defer></script>
  <script src="launch.js" defer></script>
</head>
<body>
  <main>
    <h1>DPanel</h1>
    <p id="loopback">DPanel 仅监听 NAS 本机。请在 DSM 的反向代理设置中将 HTTPS 入口转发至 <code id="destination">http://127.0.0.1:8086</code>，然后访问该 HTTPS 入口的 <code>/dpanel/ui</code>。</p>
    <p id="direct" hidden><a id="open" rel="noreferrer">打开 DPanel</a></p>
    <p>首次访问请在 DPanel 中创建管理员；DSM 账号不会自动登录 DPanel。</p>
  </main>
</body>
</html>
